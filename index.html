<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>晚餐解決器｜把選擇交給轉盤</title>
<style>
:root{--ink:#243b32;--green:#246349;--paper:#f7f5ee;--muted:#788078}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Microsoft JhengHei",sans-serif}header{max-width:1180px;margin:auto;padding:28px 32px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #dedfd4}.brand{font-size:20px;font-weight:800;letter-spacing:1px}.brand span{background:var(--green);color:white;border-radius:12px;padding:7px 10px;margin-right:10px}.tag{font-size:12px;letter-spacing:2px;color:var(--muted)}main{max-width:1100px;margin:65px auto 50px;padding:0 28px}.eyebrow{font-size:12px;font-weight:700;letter-spacing:3px;color:var(--green)}h1{font-size:clamp(36px,5vw,58px);line-height:1.25;letter-spacing:-2px;margin:18px 0}h1 em{font-style:normal;color:var(--green)}.intro{font-size:16px;color:var(--muted);line-height:1.9}.layout{display:grid;grid-template-columns:1fr 1.1fr;align-items:center;gap:65px}.chip{display:inline-block;font-size:12px;border:1px solid #d9dfd2;border-radius:30px;padding:7px 12px;margin-top:17px}.result{margin-top:28px;padding:23px 25px;background:#fffdf7;border:1px solid #dfe3d5;border-radius:20px;box-shadow:0 5px 0 #e9eade}.label{font-size:12px;color:var(--muted);letter-spacing:1px}.result h2{margin:10px 0;font-size:28px}.result p{font-size:13px;color:var(--muted);margin:0;line-height:1.8}.wheel-area{text-align:center;position:relative}.wheel-wrap{position:relative;max-width:460px;margin:0 auto 26px;padding:12px}.wheel-wrap:before{content:"";position:absolute;inset:0;border:1px dashed #c5cbbc;border-radius:50%}canvas{width:100%;display:block;border-radius:50%;box-shadow:0 12px 30px #223d3215;border:9px solid white;transition:transform 4.6s cubic-bezier(.12,.75,.12,1)}.pointer{position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:2;width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-top:34px solid var(--ink);filter:drop-shadow(0 3px 2px #0002)}.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:6px solid white;border-radius:50%;background:var(--green);color:white;width:78px;height:78px;display:grid;place-items:center;font-size:26px;box-shadow:0 3px 10px #0002}button{font:inherit;cursor:pointer}.spin{width:100%;max-width:360px;border:0;border-radius:14px;background:var(--green);color:white;padding:18px 20px;font-weight:700;font-size:17px;box-shadow:0 5px 0 #174d37;transition:background .2s,transform .2s}.spin:hover{background:#194f39}.spin:active{transform:translateY(3px)}.spin:disabled{cursor:wait;opacity:.65}.hint{font-size:12px;color:var(--muted);margin-top:15px}.options{margin-top:65px;border-top:1px solid #dedfd4;padding-top:26px}.options-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.options h3{font-size:16px;margin:0}.options small{color:var(--muted)}.foods{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.food{border:1px solid #d3dacd;background:#e7eddf;border-radius:25px;padding:9px 15px;color:var(--ink);font-size:13px}.food{display:inline-flex;align-items:center;gap:10px}.food-remove{border:0;background:transparent;color:var(--green);font-size:20px;line-height:1;padding:2px 4px;border-radius:50%}.food-remove:hover{background:#cbd8c1}.food-remove:disabled{cursor:wait;opacity:.5}button:focus-visible{outline:3px solid #c28b3c;outline-offset:4px}footer{text-align:center;color:#93988d;font-size:11px;letter-spacing:1px;padding:22px}.notice{min-height:20px;font-size:12px;color:#956638;margin-top:12px}@media(max-width:760px){header{padding:22px}.tag{display:none}main{margin-top:35px}.layout{grid-template-columns:1fr;gap:32px}h1{font-size:42px}.wheel-wrap{max-width:390px}.options{margin-top:42px}.options-head{align-items:flex-start;flex-direction:column}.result{margin-top:20px}}
@media(prefers-reduced-motion:reduce){canvas{transition-duration:.1s}}
.add-form{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.add-form label{width:100%;font-size:13px;font-weight:600}.add-form input{flex:1;min-width:160px;padding:12px 14px;border:1px solid #cbd4c5;border-radius:12px;background:#fffdf7;font:inherit;color:var(--ink)}.add-form button{border:0;border-radius:12px;padding:12px 20px;background:var(--green);color:white;font-weight:700}.add-form input:focus-visible{outline:3px solid #c28b3c;outline-offset:2px}.add-form button:disabled,.add-form input:disabled{opacity:.6;cursor:wait}
</style>
</head>
<body>
<header><div class="brand"><span>◒</span>晚餐解決器</div><div class="tag">LESS THINKING, MORE EATING.</div></header>
<main><div class="layout"><section><div class="eyebrow">YOUR DAILY DINNER DECISION</div><h1>今天晚餐，<br>讓<em>轉盤</em>決定。</h1><p class="intro">把「隨便」留給轉盤，把時間留給好好吃飯。<br>點一下，今晚的美味就有答案。</p><div class="chip">✦ 選擇困難的每日小幫手</div><div class="result" aria-live="polite" aria-atomic="true"><div class="label">TONIGHT’S PICK · 今晚吃這個</div><h2 id="result">準備好開飯了嗎？</h2><p id="description">按下「幫我決定」，看看今晚與哪道美味相遇。</p></div></section><section class="wheel-area" aria-label="晚餐隨機轉盤"><div class="wheel-wrap"><div class="pointer" aria-hidden="true"></div><canvas id="wheel" width="900" height="900" role="img" aria-label="晚餐選項轉盤"></canvas><div class="hub" aria-hidden="true">✦</div></div><button class="spin" id="spin">幫我決定！ ↗</button><p class="hint">每個選項機率相同，好吃的交給運氣。</p></section></div><section class="options"><div class="options-head"><h3>今晚的口袋名單 <small id="count"></small></h3><small>點選餐點旁的 × 即可刪除，至少保留 2 項。</small></div><div class="foods" id="foods"></div><form class="add-form" id="add-form" novalidate><label for="new-food">加入你想吃的餐點</label><input id="new-food" type="text" maxlength="20" placeholder="例如：滷味、披薩、韓式烤肉" autocomplete="off" aria-describedby="notice"><button type="submit" id="add-food">＋ 新增餐點</button></form><div class="notice" id="notice" role="status"></div></section></main><footer>晚餐解決器 · 好好吃飯，也是一件重要的小事。</footer>
<script>
'use strict';
const meals=[{name:'牛肉麵',emoji:'🍜',desc:'一碗熱騰騰的牛肉麵，讓今天有個暖心的收尾。'},{name:'壽司',emoji:'🍣',desc:'來點清爽的壽司，享受每一口簡單的美味。'},{name:'火鍋',emoji:'🍲',desc:'把喜歡的食材放進鍋裡，今晚慢慢吃、好好放鬆。'},{name:'義大利麵',emoji:'🍝',desc:'濃郁醬汁配上義大利麵，今天就吃這一味。'},{name:'咖哩飯',emoji:'🍛',desc:'香氣滿滿的咖哩拌飯，給肚子一個滿足的答案。'},{name:'漢堡',emoji:'🍔',desc:'來個扎實的漢堡，讓晚餐簡單又快樂。'},{name:'水餃',emoji:'🥟',desc:'一盤熱呼呼的水餃，熟悉的滋味最讓人安心。'},{name:'便當',emoji:'🍱',desc:'主菜、配菜一次到位，今晚就吃豐盛的便當。'}];
const colors=['#dce6cc','#f1d6ad','#a9c9b2','#eddabf','#d0ddbc','#eebf99','#b9d2bc','#efe4cc'];
const canvas=document.getElementById('wheel'),ctx=canvas.getContext('2d'),spin=document.getElementById('spin'),foods=document.getElementById('foods');let selected=meals.map((_,i)=>i),rotation=0,busy=false;
function draw(){const n=selected.length,step=2*Math.PI/n;ctx.clearRect(0,0,900,900);selected.forEach((id,i)=>{const a=-Math.PI/2+i*step;ctx.beginPath();ctx.moveTo(450,450);ctx.arc(450,450,450,a,a+step);ctx.closePath();ctx.fillStyle=colors[id%colors.length];ctx.fill();ctx.strokeStyle='#ffffff70';ctx.lineWidth=3;ctx.stroke();ctx.save();ctx.translate(450,450);ctx.rotate(a+step/2);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#243b32';ctx.font='bold '+Math.min(32,Math.max(10,Math.floor(1100/n)))+'px "Microsoft JhengHei", sans-serif';ctx.fillText(meals[id].name,302,0,235);ctx.restore()});canvas.setAttribute('aria-label','晚餐轉盤：'+selected.map(id=>meals[id].name).join('、'));document.getElementById('count').textContent='／ '+n+' 個選擇'}
function addMealButton(meal,id){const item=document.createElement('span');item.className='food';const label=document.createElement('span');label.textContent=meal.emoji+' '+meal.name;const remove=document.createElement('button');remove.type='button';remove.className='food-remove';remove.textContent='×';remove.setAttribute('aria-label','刪除'+meal.name);remove.onclick=()=>{if(busy)return;if(selected.length<=2){document.getElementById('notice').textContent='轉盤至少需要 2 道餐點，請先新增其他餐點再刪除。';return}selected=selected.filter(x=>x!==id);item.remove();draw();document.getElementById('notice').textContent='已刪除「'+meal.name+'」。'};item.appendChild(label);item.appendChild(remove);foods.appendChild(item)}
meals.forEach(addMealButton);
const addForm=document.getElementById('add-form'),newFood=document.getElementById('new-food'),addFood=document.getElementById('add-food');
addForm.onsubmit=event=>{event.preventDefault();if(busy)return;const name=newFood.value.trim(),notice=document.getElementById('notice');if(!name){notice.textContent='請先輸入想吃的餐點。';newFood.focus();return}if(Array.from(name).length>20){notice.textContent='餐點名稱請控制在 20 個字以內。';return}if(selected.some(id=>meals[id].name.normalize('NFKC').toLowerCase()===name.normalize('NFKC').toLowerCase())){notice.textContent='這道餐點已經在名單與轉盤中。';return}const id=meals.length,meal={name,emoji:'🍽️',desc:'今晚就吃你想吃的「'+name+'」，好好享受這一餐！'};meals.push(meal);selected.push(id);addMealButton(meal,id);draw();newFood.value='';notice.textContent='已新增「'+name+'」並加入轉盤。';newFood.focus()};
function randomIndex(n){const a=new Uint32Array(1),limit=Math.floor(4294967296/n)*n;do{crypto.getRandomValues(a)}while(a[0]>=limit);return a[0]%n}
spin.onclick=()=>{if(busy)return;busy=true;spin.disabled=true;newFood.disabled=true;addFood.disabled=true;foods.querySelectorAll('button').forEach(b=>b.disabled=true);spin.textContent='美味挑選中…';document.getElementById('result').textContent='今晚的答案，轉出來…';document.getElementById('description').textContent='稍等一下，美味正在路上。';const winner=randomIndex(selected.length),step=360/selected.length,target=(360-(winner+.5)*step)%360;rotation+=360*6+((target-rotation%360+360)%360);canvas.style.transform='rotate('+rotation+'deg)';const finish=()=>{const meal=meals[selected[winner]];document.getElementById('result').textContent=meal.emoji+' 今晚吃'+meal.name+'！';document.getElementById('description').textContent=meal.desc;busy=false;spin.disabled=false;newFood.disabled=false;addFood.disabled=false;spin.textContent='再幫我選一次 ↻';foods.querySelectorAll('button').forEach(b=>b.disabled=false)};setTimeout(finish,matchMedia('(prefers-reduced-motion: reduce)').matches?180:4700)};
draw();
</script>
</body>
</html>
